<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f3f2eb"><title>兩地之間 · Quiet Hours</title><meta name="description" content="兩座城市，三種觀看方式。Live View、八時段動態插畫與3D日照場景。"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v2.css"><link rel="stylesheet" href="immersive.css"><link rel="stylesheet" href="immersive-glass.css"><link rel="stylesheet" href="music.css"><link rel="stylesheet" href="cities.css"><link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="controls.css"><link rel="icon" type="image/svg+xml" href="assets/quiet-hours-mark.svg"></head>
<body>
<header class="masthead"><a class="brand" href="./"><img class="brand-logo" src="assets/quiet-hours-mark.svg" alt="" width="48" height="48"><span>兩地之間<small>QUIET HOURS</small></span></a><div class="header-actions"><button id="motion" class="quiet-button" aria-pressed="true">◌ 動態開啟</button></div></header>
<main>
<section class="intro">
  <div>
    <h1>讓時間，<em>自然流動。</em></h1>
    <p class="intro-copy">並看兩座城市的當地時間與風景。</p>
  </div>
  <button id="immerse" class="immersive-entry" type="button" aria-pressed="false">
    <span class="fullscreen-icon" aria-hidden="true">⛶</span>
    <span>進入沉浸模式</span>
  </button>
</section>
<section class="worlds" id="worlds" aria-label="兩地城市窗景"></section>
<section class="time-studio" aria-label="時間預覽"><div class="studio-label"><span class="mini-sun">☼</span><div><h3>沿著光，走過一天</h3><p id="preview-status" aria-live="polite">跟隨當下 · 兩地同步</p></div></div><div class="timeline"><div class="timeline-top"><label for="preview-city">預覽 <select id="preview-city"><option value="taipei">台北當地時間</option><option value="paris">巴黎當地時間</option></select></label><output id="preview-time" for="time-slider">--:--</output></div><input type="range" id="time-slider" min="0" max="1439" value="720" step="1" aria-label="預覽當地時間"><div class="timeline-ticks"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div></div><div class="studio-actions"><button id="day-play" class="play-button" aria-pressed="false">▷ 光影漫遊</button><button id="reset" class="quiet-button">回到此刻 ↗</button></div></section>
<section class="period-library" aria-labelledby="library-title"><div class="library-heading"><div><p class="eyebrow">EIGHT CHAPTERS OF A DAY</p><h3 id="library-title">一天，八種溫柔。</h3></div><p>選一個時段，看看插畫的光與日常。<br><span>依上方預覽城市切換 · 時段劃分為本輪提案</span></p></div><div class="period-grid" id="period-grid"></div></section>
<footer><div class="author-credit"><img src="assets/author-mark.svg" alt="" width="52" height="52" loading="lazy"><div><span class="author-name" lang="en">CHANG KAI MAU</span><small>設計與製作</small></div></div><span class="footer-note">插畫為分時段創作 · 3D 日照依座標計算 · 均非即時天氣 <span>✳</span></span></footer>
</main><noscript><p>請開啟 JavaScript 以顯示雙城時鐘與互動畫面。</p></noscript><script type="module" src="app.js"></script></body></html>
